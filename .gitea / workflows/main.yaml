name: Complete DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  secret-scan:
    uses: holdingforce/Test/.gitea/workflows/secret-scan.yml@main
    secrets: inherit

  sast-sbom:
    needs: secret-scan
    uses: holdingforce/Test/.gitea/workflows/sast-scan-sbom.yml@main
    secrets: inherit

  # 3. 建置與部署至 IIS (MSBuild & IIS Deploy)
  build-deploy:
    needs: sast-sbom
    uses: holdingforce/Test/.gitea/workflows/MSDevlop.yaml@main
    secrets: inherit

  dast-k6:
    needs: build-deploy
    uses: holdingforce/Test/.gitea/workflows/dast-scan-k6.yaml@main
    secrets: inherit

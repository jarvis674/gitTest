# Simulation only. GitHub reads .github/workflows, not .gitea/workflows.
# feature/* runs secret scan, develop runs SAST/SBOM/SCA, main runs DAST and k6.
# These jobs only print the selected gate. They do not call the Gitea templates.

name: Branch routing

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  secret-scan:
    if: startsWith(github.ref, 'refs/heads/feature/')
    runs-on: ubuntu-latest
    steps:
      - name: Secret scan gate
        run: echo "Branch ${{ github.ref_name }} runs secret scan."

  sast-sbom-sca:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: SAST SBOM SCA gate
        run: echo "Branch ${{ github.ref_name }} runs SAST, SBOM, and SCA."

  dast-k6:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: DAST and k6 gate
        run: echo "Branch ${{ github.ref_name }} runs DAST and k6."
